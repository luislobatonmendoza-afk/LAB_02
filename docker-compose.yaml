
services:
  db:
    image: postgres:13-alpine
    environment:
      POSTGRES_USER: luis_admin
      POSTGRES_PASSWORD: lab02
      POSTGRES_DB: luis_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api1:
    build: ./api
    ports:
      - "3001:3000"
    environment:
      - MESSAGE="Hola, soy Lobaton Mendoza Luis Angel Manuel"
    depends_on:
      - db

  api2:
    build: ./api
    ports:
      - "3002:3000"
    environment:
      - MESSAGE="Hola, soy Lobaton Mendoza Luis Angel Manuel - Replica 1"
    depends_on:
      - db

  api3:
    build: ./api
    ports:
      - "3003:3000"
    environment:
      - MESSAGE="Hola, soy Lobaton Mendoza Luis Angel Manuel - Replica 2"
    depends_on:
      - db

volumes:
  pgdata: